<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2d3722">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Vault">
    <title>Scuffed Boots Vault</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Pinned versions -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Stint+Ultra+Condensed&display=swap" rel="stylesheet">

    <style>
        :root {
            --army: #2d3722; --army-light: #3e4d30; --leather: #8b5a2b; --dust: #f4ece1;
            --sand: #ead9bd; --danger: #8b1e1e; --ok: #2d6a2d; --ink: #222;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--army); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--ink); }
        #root { height: 100dvh; display: flex; justify-content: center; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
        .app-container { width: 100%; max-width: 1200px; height: 100dvh; background-color: var(--dust); display: flex; flex-direction: column; position: relative; overflow: hidden; }

        :focus-visible { outline: 3px solid #e0a53a; outline-offset: 2px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        .rye { font-family: 'Rye', cursive; }
        .muted { color: #5c5c5c; font-size: 0.9em; }

        /* Header (safe-area aware) */
        header { padding: calc(env(safe-area-inset-top, 0px) + 20px) 15px 16px; text-align: center; background: var(--army); border-bottom: 5px solid var(--leather); flex-shrink: 0; z-index: 10; }
        .header-title { font-family: 'Rye', cursive; color: white; margin: 0; font-size: clamp(20px, 7vw, 32px); white-space: nowrap; }
        .version-tag { color: #b5b5b5; font-size: 11px; margin: 5px 0 0; }

        main { flex: 1; overflow-y: auto; padding: 20px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
        main:focus { outline: none; }
        main h2 { font-family: 'Rye', cursive; font-weight: normal; margin: 20px 0 12px; }
        main h2:first-child { margin-top: 0; }

        .western-card { background: white; padding: 16px; margin-bottom: 15px; border-radius: 12px; border-left: 6px solid var(--army); box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .western-card h3 { margin: 0 0 6px; padding-right: 44px; }
        .card-title { display: block; padding-right: 44px; font-weight: bold; margin-bottom: 4px; }
        .card-meta { margin: 2px 0; font-size: 0.92em; }
        .link { color: var(--leather); font-weight: bold; text-decoration: underline; }
        .link:hover { color: var(--army); }

        .event-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: block; }
        .video-preview-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background-color: #111; display: block; }

        .calendar-scroll-container { width: 100%; max-height: 360px; overflow: auto; border: 2px solid var(--army); border-radius: 8px; background: white; touch-action: pan-x pan-y pinch-zoom; }
        .calendar-img { display: block; max-width: none; height: auto; }
        .zoom-control { display: flex; gap: 10px; justify-content: center; margin: 0 0 12px; }
        .zoom-btn { background: var(--army); color: white; min-height: 44px; padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }

        /* Buttons / inputs */
        .btn-action { background: var(--army); color: white; padding: 14px; border-radius: 8px; width: 100%; border: none; font-family: 'Rye', cursive; font-size: 1rem; cursor: pointer; margin-top: 10px; min-height: 48px; }
        .btn-action:hover { background: var(--army-light); }
        .btn-action:disabled { opacity: 0.55; cursor: wait; }
        .btn-leather { background: var(--leather); }
        .btn-grey { background: #555; }
        .btn-quiet { background: none; border: none; color: var(--leather); font-weight: bold; text-decoration: underline; cursor: pointer; padding: 10px 4px; min-height: 44px; }

        .field { margin: 8px 0; }
        .field label { display: block; font-size: 0.85em; font-weight: bold; margin-bottom: 3px; }
        .admin-input, .search-bar { width: 100%; padding: 11px; border: 1px solid #bbb; border-radius: 8px; background: white; font-size: 16px; font-family: inherit; }
        .search-bar { margin-bottom: 12px; }
        input[type="file"] { max-width: 100%; font-size: 14px; }

        .filter-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; padding: 10px; background: #fff; border: 2px solid var(--leather); border-radius: 8px; }
        .filter-btn { background: var(--sand); color: var(--army); border: 2px solid var(--leather); min-height: 44px; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .filter-btn[aria-pressed="true"] { background: var(--army); color: #fff; border-color: #000; }

        .heart-btn { position: absolute; top: 10px; right: 10px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.92); box-shadow: 0 1px 4px rgba(0,0,0,0.35); font-size: 18px; cursor: pointer; color: #b5b5b5; }
        .heart-btn.active { color: var(--danger); }

        .notice-card { border-left-color: var(--leather); background: #fbf3e4; }
        .notice-card h3 { font-size: 1.05em; }
        .bulk-text { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
        .bulk-example { background: #f3eee6; padding: 10px; border-radius: 8px; font-size: 12px; overflow-x: auto; white-space: pre; }
        .bulk-bad span { color: var(--danger); }
        .bulk-dup span { color: #777; }

        /* Admin */
        .admin-section { background: #fffafa; border: 2px dashed var(--danger); padding: 15px; border-radius: 12px; margin: 15px 0 20px; }
        .admin-section h3 { margin: 0 0 4px; }
        .admin-block { border-top: 1px solid #e3c9c9; padding: 6px 0; }
        .admin-block summary { cursor: pointer; font-weight: bold; padding: 10px 0; min-height: 44px; }
        .admin-list { list-style: none; margin: 10px 0 0; padding: 0; }
        .admin-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid #eee; }
        .link-danger { background: none; border: none; color: var(--danger); text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 6px; font-weight: bold; }

        /* Messages */
        .state-note { text-align: center; padding: 18px 10px; color: #555; }
        .error-msg { color: var(--danger); font-size: 0.9em; font-weight: bold; margin: 10px 0; padding: 10px; background: #ffebeb; border-radius: 5px; }
        .toast { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); z-index: 30; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; color: white; font-weight: bold; box-shadow: 0 4px 14px rgba(0,0,0,0.35); background: #333; }
        .toast span { flex: 1; }
        .toast-success { background: var(--ok); }
        .toast-error { background: var(--danger); }
        .toast-action { background: white; color: var(--army); border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; cursor: pointer; min-height: 40px; }
        .toast-close { background: none; border: none; color: white; font-size: 22px; cursor: pointer; min-width: 36px; min-height: 40px; }


        /* Nav (safe-area aware) */
        nav { flex-shrink: 0; background: white; border-top: 1px solid #ddd; padding: 8px 8px calc(env(safe-area-inset-bottom, 0px) + 8px); display: flex; justify-content: space-around; z-index: 10; font-family: 'Stint Ultra Condensed', sans-serif; font-size: 18px; }
        .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #6b6b6b; min-width: 64px; min-height: 48px; font-family: inherit; font-size: inherit; }
        .nav-btn[aria-current="page"] { color: var(--army); font-weight: bold; font-size: 20px; border-bottom: 3px solid var(--leather); }

        /* ---------- Layout: shared ---------- */
        .home-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
        .home-grid section h2 { margin-top: 0; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .media-grid .western-card { margin-bottom: 0; }
        .auth-card { max-width: 440px; margin-left: auto; margin-right: auto; }
        .account-grid { display: flex; flex-direction: column; }
        .acct-left, .acct-right { display: contents; }
        .acct-info { order: 1; } .acct-fav { order: 2; } .acct-right > * { order: 3; } .acct-logout { order: 4; }

        /* ---------- Desktop and large tablets ---------- */
        @media (min-width: 900px) {
            .app-container { box-shadow: 0 0 40px rgba(0, 0, 0, 0.4); }
            header { order: 0; display: flex; align-items: baseline; justify-content: space-between; text-align: left; padding: calc(env(safe-area-inset-top, 0px) + 22px) 32px 18px; }
            .header-title { font-size: 34px; }
            .version-tag { margin: 0; }
            nav { order: 1; border-top: none; border-bottom: 1px solid #d8d0c4; justify-content: flex-start; gap: 6px; padding: 0 24px; }
            .nav-btn { min-width: 110px; min-height: 52px; border-bottom: 3px solid transparent; }
            .nav-btn:hover { background: var(--dust); }
            .nav-btn[aria-current="page"] { border-bottom-color: var(--leather); }
            main { order: 2; padding: 28px 32px 40px; }

            .toast { left: 50%; right: auto; transform: translateX(-50%); bottom: 24px; width: min(540px, calc(100% - 48px)); }

            .home-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); column-gap: 32px; row-gap: 8px; align-items: start; }
            .sec-cal { grid-column: 1; grid-row: 1 / span 2; }
            .sec-tip { grid-column: 2; grid-row: 1; }
            .sec-events { grid-column: 2; grid-row: 2; }
            .calendar-scroll-container { max-height: 78vh; }
            .event-img { aspect-ratio: 4 / 3; }

            .search-bar { max-width: 520px; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

            .account-grid.has-admin { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); column-gap: 32px; align-items: start; }
            .account-grid:not(.has-admin) { max-width: 560px; }
            .acct-left { display: flex; flex-direction: column; }
            .acct-right { display: block; }
            .acct-right .admin-section { margin-top: 0; }
        }

        @media (min-width: 900px) and (hover: hover) {
            .media-grid .western-card { transition: box-shadow 0.15s, transform 0.15s; }
            .media-grid .western-card:hover { box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2); transform: translateY(-2px); }
        }

        /* Short landscape phones: keep chrome compact */
        @media (max-height: 480px) and (orientation: landscape) {
            header { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px; border-bottom-width: 3px; }
            .version-tag { display: none; }
            .nav-btn { min-height: 40px; }
            nav { padding-top: 2px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); }
        }

    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const VERSION = '1.3.1';

        const firebaseConfig = {
            apiKey: "AIzaSyCfQA869ro1UWeLgBEWlf2mlJcRCftIWBQ",
            authDomain: "pocket-stacy.firebaseapp.com",
            projectId: "pocket-stacy",
            storageBucket: "pocket-stacy.firebasestorage.app",
            messagingSenderId: "657141846000",
            appId: "1:657141846000:web:95861ee6737184bd1ad735"
        };
        const appId = 'scuffed-boots-vault';
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        // Keep data available offline after the first load
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const html = htm.bind(React.createElement);

        const LEVELS = ['Beginner', 'Improver', 'Intermediate', 'Advanced'];
        const FILTER_LEVELS = ['All', ...LEVELS];
        const sortAlpha = (a, b) => (a.title || '').localeCompare(b.title || '');
        const sortByName = (a, b) => (a.name || '').localeCompare(b.name || '');
        const stamp = () => firebase.firestore.FieldValue.serverTimestamp();
        const tsMillis = (t) => (t && typeof t.toMillis === 'function') ? t.toMillis() : (typeof t === 'number' ? t : 0);

        /* ---------- date helpers ---------- */
        const pad = (n) => String(n).padStart(2, '0');
        const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
        const isIsoDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
        const formatDate = (s) => isIsoDate(s)
            ? new Date(s + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
            : (s || '');
        const formatTime = (s) => {
            const m = /^(\d{2}):(\d{2})$/.exec(s || '');
            if (!m) return s || '';
            const d = new Date(); d.setHours(+m[1], +m[2], 0, 0);
            return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        };

        const formatTimeRange = (s, e) => { const a = formatTime(s), b = formatTime(e); return a && b ? a + ' – ' + b : a; };
        const formatDateRange = (s, e) => {
            if (!isIsoDate(s)) return s || '';
            if (!isIsoDate(e) || e === s) return formatDate(s);
            const d1 = new Date(s + 'T00:00:00'), d2 = new Date(e + 'T00:00:00');
            const short = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            return short(d1) + ' – ' + short(d2) + ', ' + d2.getFullYear();
        };
        const isRealDate = (s) => {
            if (!isIsoDate(s)) return false;
            const d = new Date(s + 'T00:00:00');
            return d.getFullYear() === +s.slice(0, 4) && pad(d.getMonth() + 1) === s.slice(5, 7) && pad(d.getDate()) === s.slice(8, 10);
        };
        // Accepts "19:30", "7:30pm", "7pm", "midnight". Returns '' for blank, null if unreadable.
        const parseTimeInput = (raw) => {
            const t = (raw || '').trim().toLowerCase().replace(/\s+/g, '');
            if (!t) return '';
            if (t === 'midnight') return '00:00';
            const m = /^(\d{1,2})(?::(\d{2}))?(am|pm)?$/.exec(t);
            if (!m) return null;
            let h = +m[1]; const min = m[2] ? +m[2] : 0; const ap = m[3];
            if (min > 59) return null;
            if (ap) { if (h < 1 || h > 12) return null; if (ap === 'pm' && h !== 12) h += 12; if (ap === 'am' && h === 12) h = 0; }
            else if (h > 23) return null;
            return pad(h) + ':' + pad(min);
        };

        /* ---------- misc helpers ---------- */
        const getYouTubeThumbnail = (url) => {
            if (!url) return null;
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regExp);
            return match ? 'https://img.youtube.com/vi/' + match[1] + '/hqdefault.jpg' : null;
        };

        const authMessage = (e) => ({
            'auth/invalid-email': 'That email address doesn’t look right.',
            'auth/user-not-found': 'Email or password is incorrect.',
            'auth/wrong-password': 'Email or password is incorrect.',
            'auth/invalid-credential': 'Email or password is incorrect.',
            'auth/email-already-in-use': 'An account with that email already exists. Try logging in.',
            'auth/weak-password': 'Choose a password with at least 6 characters.',
            'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
            'auth/network-request-failed': 'Network problem. Check your connection and try again.'
        }[e.code] || e.message);

        async function uploadFile(folder, file) {
            const safe = file.name.replace(/[^\w.\-]+/g, '_');
            const ref = storage.ref().child(folder + '/' + Date.now() + '_' + safe);
            const snap = await ref.put(file, file.type ? { contentType: file.type } : undefined);
            return snap.ref.getDownloadURL();
        }
        async function deleteStoredFile(url) {
            if (!url || !url.includes('firebasestorage')) return;
            try { await storage.refFromURL(url).delete(); } catch (e) { /* already gone or not ours */ }
        }

        /* ---------- data hook: subscribe once, clean up ---------- */
        function useCollection(name) {
            const [state, setState] = useState({ items: [], loading: true, error: null, fromCache: true });
            useEffect(() => {
                const unsub = db.collection(name).onSnapshot(
                    (s) => setState({
                        items: s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })),
                        loading: false, error: null, fromCache: s.metadata.fromCache
                    }),
                    (e) => setState(p => ({ ...p, loading: false, error: e.message }))
                );
                return unsub;
            }, [name]);
            return state;
        }

        /* ---------- small UI pieces ---------- */
        function Toast({ toast, onClose }) {
            if (!toast) return null;
            return html`<div className=${'toast toast-' + toast.type} role=${toast.type === 'error' ? 'alert' : 'status'}>
                <span>${toast.msg}</span>
                ${toast.action && html`<button className="toast-action" onClick=${() => { toast.action.onClick(); onClose(); }}>${toast.action.label}</button>`}
                <button className="toast-close" aria-label="Dismiss message" onClick=${onClose}>×</button>
            </div>`;
        }

        function StateNote({ state, emptyText, hasVisible }) {
            if (state.error) return html`<p className="error-msg" role="alert">Couldn’t load this section: ${state.error}</p>`;
            if (state.loading) return html`<p className="state-note" role="status">Loading…</p>`;
            if (!hasVisible) return html`<p className="state-note">${emptyText}</p>`;
            return null;
        }

        const Field = ({ label, id, children }) => html`<div className="field"><label htmlFor=${id}>${label}</label>${children}</div>`;

        /* ---------- Home ---------- */
        function EventCard({ e }) {
            const dateText = formatDateRange(e.date, e.endDate);
            const timeText = formatTimeRange(e.time, e.endTime);
            const when = dateText + (timeText ? ' at ' + timeText : '');
            return html`<article className=${'western-card' + (e.kind === 'notice' ? ' notice-card' : '')}>
                ${e.imageUrl && html`<img src=${e.imageUrl} className="event-img" alt=${e.name ? e.name + ' flyer' : 'Event flyer'} loading="lazy" />`}
                <h3>${e.name}</h3>
                ${when && html`<p className="card-meta">${when}</p>`}
                ${e.location && html`<p className="card-meta"><strong>Location:</strong> ${e.location}</p>`}
            </article>`;
        }

        function EventsSection({ state }) {
            const [showPast, setShowPast] = useState(false);
            const { upcoming, past } = useMemo(() => {
                const today = todayStr();
                const key = (e) => e.date + ' ' + (e.time || '');
                const byDate = (a, b) => key(a).localeCompare(key(b));
                const endOf = (e) => isIsoDate(e.endDate) ? e.endDate : e.date;
                const dated = state.items.filter(e => isIsoDate(e.date));
                const legacy = state.items.filter(e => !isIsoDate(e.date)).sort(sortByName); // older events with free-text dates stay visible
                return {
                    upcoming: [...dated.filter(e => endOf(e) >= today).sort(byDate), ...legacy],
                    past: dated.filter(e => endOf(e) < today).sort(byDate).reverse()
                };
            }, [state.items]);

            return html`<section>
                <h2>Events</h2>
                <${StateNote} state=${state} emptyText="No upcoming events right now. Check back soon." hasVisible=${upcoming.length > 0} />
                ${upcoming.map(e => html`<${EventCard} key=${e.id} e=${e} />`)}
                ${past.length > 0 && html`<button className="btn-quiet" aria-expanded=${showPast} onClick=${() => setShowPast(v => !v)}>
                    ${showPast ? 'Hide past events' : 'Show ' + past.length + ' past event' + (past.length === 1 ? '' : 's')}
                </button>`}
                ${showPast && past.map(e => html`<${EventCard} key=${e.id} e=${e} />`)}
            </section>`;
        }

        function CalendarSection({ calendar }) {
            const [zoom, setZoom] = useState(1);
            return html`<section>
                <h2>Calendar</h2>
                ${calendar ? html`<div>
                    <div className="zoom-control">
                        <button className="zoom-btn" aria-label="Zoom out" onClick=${() => setZoom(z => Math.max(1, z - 0.5))}>Zoom −</button>
                        <button className="zoom-btn" aria-label="Reset zoom" onClick=${() => setZoom(1)}>Reset</button>
                        <button className="zoom-btn" aria-label="Zoom in" onClick=${() => setZoom(z => Math.min(3, z + 0.5))}>Zoom +</button>
                    </div>
                    <div className="calendar-scroll-container" tabIndex="0" aria-label="Class calendar, scrollable">
                        <img src=${calendar} className="calendar-img" style=${{ width: (zoom * 100) + '%' }} alt="Current class and event calendar" />
                    </div>
                </div>` : html`<p className="state-note">No calendar has been posted yet.</p>`}
            </section>`;
        }

        function TipSection({ state }) {
            const tip = useMemo(() => state.items.length
                ? [...state.items].sort((a, b) => tsMillis(b.createdAt) - tsMillis(a.createdAt))[0]
                : null, [state.items]);
            const thumb = tip ? getYouTubeThumbnail(tip.fileUrl) : null;
            return html`<section>
                <h2>Tip of the Week</h2>

        const BULK_EXAMPLE = [
            '# date | name | start | end | location | type (optional: notice)',
            '2026-12-03 | Crisco | 7:30pm | 8:30pm | Puyallup Activity Center',
            '2026-12-05 | Holiday Social | 7pm | midnight | Fruitland Grange',
            '2026-12-22 to 2026-12-28 | Holiday break | | | | notice'
        ].join('\n');

        function parseEventLines(text, existingEvents) {
            const existing = new Set(existingEvents.map(e => (e.date || '') + '|' + (e.name || '').trim().toLowerCase()));
            const seen = new Set();
            return text.split('\n')
                .map((raw, i) => ({ raw: raw.trim(), line: i + 1 }))
                .filter(r => r.raw && !r.raw.startsWith('#'))
                .map(({ raw, line }) => {
                    const [dateRaw = '', name = '', startRaw = '', endRaw = '', location = '', typeRaw = ''] = raw.split('|').map(x => x.trim());
                    const row = { line, name, location, date: '', endDate: '', start: '', end: '', kind: 'event', error: '', duplicate: false };
                    const dm = /^(\d{4}-\d{2}-\d{2})(?:\s*(?:to|\.\.|–|—)\s*(\d{4}-\d{2}-\d{2}))?$/i.exec(dateRaw);
                    if (!dm || !isRealDate(dm[1]) || (dm[2] && !isRealDate(dm[2]))) { row.error = 'Date should look like 2026-12-03 (or 2026-12-22 to 2026-12-28).'; return row; }
                    row.date = dm[1];
                    if (dm[2]) {
                        if (dm[2] < dm[1]) { row.error = 'The last day comes before the first day.'; return row; }
                        if (dm[2] > dm[1]) row.endDate = dm[2];
                    }
                    if (!name) { row.error = 'Missing event name.'; return row; }
                    const st = parseTimeInput(startRaw), en = parseTimeInput(endRaw);
                    if (st === null) { row.error = 'Couldn’t read the start time “' + startRaw + '”. Try 7:30pm.'; return row; }
                    if (en === null) { row.error = 'Couldn’t read the end time “' + endRaw + '”. Try 8:30pm.'; return row; }
                    row.start = st; row.end = en;
                    const t = typeRaw.toLowerCase();
                    if (['notice', 'closure', 'note'].includes(t)) row.kind = 'notice';
                    else if (t && t !== 'event') { row.error = 'Type should be blank or “notice”.'; return row; }
                    const key = row.date + '|' + name.toLowerCase();
                    if (existing.has(key) || seen.has(key)) row.duplicate = true;
                    seen.add(key);
                    return row;
                });
        }

                <h3 className="rye" style=${{ fontWeight: 'normal' }}>Command Center</h3>
                <p className="muted">Changes go live for everyone right away.</p>
                <details className="admin-block"><summary>1. Calendar</summary><${CalendarAdmin} notify=${notify} /></details>
                <details className="admin-block"><summary>2. Library</summary><${LibraryAdmin} items=${sortedLib} notify=${notify} onDelete=${(i) => del('library', i)} /></details>
                <details className="admin-block"><summary>3. Video library</summary><${VideoAdmin} items=${sortedVid} libraryItems=${library} notify=${notify} onDelete=${(i) => del('video_library', i)} /></details>
                <details className="admin-block"><summary>4. Tips</summary><${TipAdmin} items=${tips} notify=${notify} onDelete=${(i) => del('daily_tips', i)} /></details>
                <details className="admin-block"><summary>5. Events and notices</summary><${EventAdmin} items=${events} notify=${notify} onDelete=${(i) => del('events', i)} /></details>
                <details className="admin-block"><summary>6. Bulk add events</summary><${BulkEventAdmin} items=${events} notify=${notify} /></details>
                <details className="admin-block"><summary>7. Favicon</summary><${FaviconAdmin} notify=${notify} /></details>
            </section>`;
        }

        /* ---------- Account ---------- */
        function AccountTab({ authReady, user, isAdmin, favItems, library, videos, tips, events, notify }) {
            if (!authReady) return html`<p className="state-note" role="status">Loading…</p>`;
            if (!user) return html`<${AuthForm} notify=${notify} />`;
            return html`<div>
                <h2>Account</h2>
                <div className=${'account-grid' + (isAdmin ? ' has-admin' : '')}>
                    <div className="acct-left">
                        <div className="western-card acct-info">
                            <p style=${{ margin: '0 0 6px' }}>Signed in as <strong>${user.email}</strong></p>
                            <details>
                                <summary className="muted">Account details</summary>
                                <p className="muted" style=${{ wordBreak: 'break-all' }}>Member ID: ${user.uid}</p>
                            </details>
                        </div>

                        <div className="western-card acct-fav">
                            <h3 className="rye" style=${{ fontWeight: 'normal' }}>Favorites</h3>
                            ${favItems.length === 0 && html`<p className="muted">No favorites yet. Tap the heart on any PDF or video to save it here.</p>`}
                            ${favItems.map(item => html`<div key=${item.kind + item.id} style=${{ marginBottom: '10px' }}>
                                <strong>${item.title}</strong><br />
                                <a className="link" href=${item.fileUrl} target="_blank" rel="noopener noreferrer">${item.kind === 'pdf' ? 'View PDF' : 'Watch'}</a>
                            </div>`)}
                        </div>

                        <button className="btn-action btn-grey acct-logout" onClick=${() => auth.signOut()}>Logout</button>
                    </div>
                    ${isAdmin && html`<div className="acct-right"><${AdminPanel} library=${library.items} videos=${videos.items} tips=${tips.items} events=${events.items} notify=${notify} /></div>`}
                </div>
            </div>`;
        }

        /* ---------- App ---------- */
        function App() {
            const [user, setUser] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [tab, setTab] = useState('home');
            const [toast, setToast] = useState(null);
            const [favorites, setFavorites] = useState([]);
            const [calendar, setCalendar] = useState(null);
            const mainRef = useRef(null);
            const toastTimer = useRef(null);

            const events = useCollection('events');
            const library = useCollection('library');
            const videos = useCollection('video_library');
            const tips = useCollection('daily_tips');

            const notify = useCallback((msg, type = 'info', action = null) => {
                clearTimeout(toastTimer.current);
                setToast({ msg, type, action });
                toastTimer.current = setTimeout(() => setToast(null), action ? 7000 : 4500);
            }, []);

            // Auth (subscribe once)
            useEffect(() => auth.onAuthStateChanged(u => { setUser(u); setAuthReady(true); }), []);

            // Admin check: a doc at admins/{uid} makes someone an admin (rules enforce it server-side too)
            useEffect(() => {
                if (!user) { setIsAdmin(false); return; }
                let cancelled = false;
                db.collection('admins').doc(user.uid).get()
                    .then(d => { if (!cancelled) setIsAdmin(d.exists); })
                    .catch(() => { if (!cancelled) setIsAdmin(false); });
                return () => { cancelled = true; };
            }, [user]);

            // Favorites for the signed-in user
            const uid = user ? user.uid : null;
            useEffect(() => {
                if (!uid) { setFavorites([]); return; }
                return db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('favorites')
                    .onSnapshot(s => setFavorites(s.docs.map(d => d.id)), e => console.error('Favorites error', e));
            }, [uid]);

            // Settings docs
            useEffect(() => db.collection('settings').doc('calendar').onSnapshot(
                s => setCalendar(s.exists ? s.data().imageUrl : null), e => console.error('Calendar error', e)), []);
            useEffect(() => db.collection('settings').doc('favicon').onSnapshot(s => {
                if (s.exists && s.data().url) { const l = document.querySelector("link[rel='icon']"); if (l) l.href = s.data().url; }
            }, e => console.error('Favicon error', e)), []);

            // Quietly drop favorites whose item was deleted (only once fresh server data has loaded)
            useEffect(() => {
                if (!uid || favorites.length === 0) return;
                if (library.loading || videos.loading || library.error || videos.error) return;
                if (library.fromCache || videos.fromCache) return;
                const live = new Set([...library.items, ...videos.items].map(i => i.id));
                const orphans = favorites.filter(id => !live.has(id));
                if (!orphans.length) return;
                const col = db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('favorites');
                const batch = db.batch();
                orphans.forEach(id => batch.delete(col.doc(id)));
                batch.commit().catch(() => {});
            }, [uid, favorites, library, videos]);

            useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; }, [tab]);

            const promptLogin = useCallback((msg) => notify(msg || 'Log in to save favorites.', 'info', { label: 'Log in', onClick: () => setTab('account') }), [notify]);

            const toggleFavorite = async (itemId) => {
                if (!user) return promptLogin('Log in to save favorites.');
                const ref = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('favorites').doc(itemId);
                try {
                    if (favorites.includes(itemId)) await ref.delete();
                    else await ref.set({ timestamp: Date.now() });
                } catch (e) { notify('Couldn’t update favorites: ' + e.message, 'error'); }
            };

            const favItems = useMemo(() => [
                ...library.items.map(i => ({ ...i, kind: 'pdf' })),
                ...videos.items.map(i => ({ ...i, kind: 'video' }))
            ].filter(i => favorites.includes(i.id)).sort(sortAlpha), [library.items, videos.items, favorites]);

            let content;
            if (tab === 'home') content = html`<${HomeTab} tips=${tips} calendar=${calendar} events=${events} />`;
            else if (tab === 'library') content = html`<${MediaTab} kind="pdf" state=${library} favorites=${favorites} loggedIn=${!!user} onToggle=${toggleFavorite} promptLogin=${promptLogin} />`;
            else if (tab === 'video') content = html`<${MediaTab} kind="video" state=${videos} favorites=${favorites} loggedIn=${!!user} onToggle=${toggleFavorite} promptLogin=${promptLogin} />`;
            else content = html`<${AccountTab} authReady=${authReady} user=${user} isAdmin=${isAdmin} favItems=${favItems} library=${library} videos=${videos} tips=${tips} events=${events} notify=${notify} />`;

            return html`<div className="app-container">
                <header>
                    <h1 className="header-title">Scuffed Boots Vault</h1>
                    <p className="version-tag">v${VERSION}</p>
                </header>
                <main ref=${mainRef} tabIndex="-1">${content}</main>
                <${Toast} toast=${toast} onClose=${() => setToast(null)} />
                <nav aria-label="Main">
                    ${['home', 'library', 'video', 'account'].map(t => html`<button key=${t} className="nav-btn" aria-current=${tab === t ? 'page' : undefined} onClick=${() => setTab(t)}>${t.charAt(0).toUpperCase() + t.slice(1)}</button>`)}
                </nav>
            </div>`;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
